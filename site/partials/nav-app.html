  </div>

  <div class="cart-panel" x-cloak x-show="cartOpen" @click.outside="cartOpen = false" @keydown.escape.window="cartOpen && (cartOpen = false)" x-transition.opacity.duration.150ms>
    <template x-if="!selected.length">
      <p class="cart-empty">Your toolbox is empty. Tick tools below or start from a preset.</p>
    </template>
    <template x-if="selected.length">
      <div>
        <p class="cart-title">Your toolbox <span x-text="'· ' + selected.length + (selected.length === 1 ? ' tool' : ' tools')"></span></p>
        <div class="cart-items">
          <template x-for="id in selectedSorted" :key="id">
            <span class="cart-chip" @mouseenter="showTip(id, $event)" @mouseleave="hideTip" @focusin="showTip(id, $event)" @focusout="hideTip">
              <span x-text="nameOf(id)"></span>
              <button type="button" @click="remove(id)" :aria-label="'Remove ' + nameOf(id)">&times;</button>
            </span>
          </template>
        </div>
        <code class="cart-command" x-show="command" :class="{ copied: copied }" x-html="hl(command)" @click="copy" role="button" tabindex="0" @keydown.enter.prevent="copy" aria-label="Copy install command"></code>
        <p class="cart-pending" x-show="!command">Minting your short link&hellip;</p>
      </div>
    </template>
  </div>
</header>
